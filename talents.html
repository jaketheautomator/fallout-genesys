<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Talent Browser</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div id="app">

        <header class="browser-header">
            <div>
                <h1>Talent Browser</h1>

                <p>
                    Browse talents available in the
                    A Song of Ice and Fire Genesys hack.
                </p>
            </div>
        </header>


        <main class="talent-browser">

            <section class="talent-browser-controls">

                <label class="talent-search">
                    <span>Search</span>

                    <input
                        id="talent-search"
                        type="search"
                        placeholder="Search talents..."
                        autocomplete="off"
                    >
                </label>


                <label>
                    <span>Tier</span>

                    <select id="talent-tier-filter">
                        <option value="all">
                            All Tiers
                        </option>

                        <option value="1">
                            Tier 1
                        </option>

                        <option value="2">
                            Tier 2
                        </option>

                        <option value="3">
                            Tier 3
                        </option>

                        <option value="4">
                            Tier 4
                        </option>

                        <option value="5">
                            Tier 5
                        </option>
                    </select>
                </label>


                <label>
                    <span>Activation</span>

                    <select id="talent-activation-filter">
                        <option value="all">
                            All
                        </option>
                    </select>
                </label>


                <label>
                    <span>Ranked</span>

                    <select id="talent-ranked-filter">
                        <option value="all">
                            All
                        </option>

                        <option value="ranked">
                            Ranked
                        </option>

                        <option value="unranked">
                            Unranked
                        </option>
                    </select>
                </label>

            </section>


            <section class="talent-browser-summary">
                <span id="talent-result-count"></span>

                <button
                    id="talent-clear-filters"
                    type="button"
                >
                    Clear Filters
                </button>
            </section>


            <section
                id="talent-browser-results"
                class="talent-browser-results"
            >
            </section>

        </main>

    </div>


    <script src="js/data.js"></script>
    <script src="js/equipment-data.js"></script>
    <script src="js/talent-data.js"></script>
    <script src="js/talents.js"></script>

</body>
</html>
