<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fallout Genesys Character Builder</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fallout-creation.css?v=skills-three-column-4">
</head>
<body>
  <main id="app">
    <header class="app-header"><h1>FALLOUT</h1><p>Genesys Character Builder</p></header>
    <div class="builder-layout">
      <section class="builder">
        <nav id="creation-nav" aria-label="Character creation steps">
          <button type="button" data-step="origin">Origin</button>
          <button type="button" data-step="special">S.P.E.C.I.A.L.</button>
          <button type="button" data-step="skills">Skills</button>
          <button type="button" disabled title="Next implementation stage">Perks</button>
          <button type="button" disabled title="Next implementation stage">Equipment</button>
          <button type="button" disabled title="Next implementation stage">Review</button>
        </nav>
        <section id="builder-content" aria-live="polite"></section>
      </section>
      <aside id="character-summary">
        <h2>Character</h2>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Character Name">
        <p id="summary-name">Unnamed Wastelander</p>
        <hr>
        <p><strong>Origin:</strong> <span id="summary-origin">Survivor</span></p>
        <p><strong>XP Spent:</strong> <span id="summary-xp-spent">0</span></p>
        <p><strong>XP Remaining:</strong> <span id="summary-xp-remaining">110</span></p>
        <p><strong>Caps:</strong> <span id="summary-caps">1,000</span></p>
      </aside>
    </div>
  </main>
  <script src="js/origins-data.js"></script>
  <script src="js/fallout-creation.js?v=skills-three-column-4"></script>
</body>
</html>
